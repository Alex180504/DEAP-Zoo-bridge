# SonarQube scanner configuration.
#
# Analysis runs against the local Community Build instance started by
# docker/sonarqube/docker-compose.yml. Drive it with scripts/sonar_scan.ps1
# (or .sh), which supplies sonar.host.url and the auth token.

sonar.projectKey=deap-pettingzoo
sonar.projectName=DEAP-bridge
sonar.sourceEncoding=UTF-8

# Scope matches what CI lints (`black —check deap_pettingzoo`): the library
# package is the deliverable. examples/ and scripts/ are research drivers held
# to a different standard, so they stay out of the quality figures.
sonar.sources=deap_pettingzoo
sonar.tests=tests

# Both interpreters the CI matrix covers, so rules do not flag syntax that is
# valid on one of them.
sonar.python.version=3.11,3.12

# Generated PlantUML output and build artefacts carry no reviewable source.
# _pureples is a vendored MIT subset of the upstream pureples project, so its
# defects are not ours to fix and would otherwise dominate the bug count.
sonar.exclusions=docs/UML/**,build/**,dist/**,**/__pycache__/**,deap_pettingzoo/contrib/neat/_pureples/**

# Written by `pytest —cov-report=xml`; the scan script adds that flag because
# pyproject's addopts emit only term-missing and HTML.
sonar.python.coverage.reportPaths=coverage.xml

# Reviewed false positives. Kept here rather than as UI "False Positive"
# transitions so the justification is version-controlled and survives a fresh
# server. Each was checked against the source before being added; findings that
# turned out to be real were fixed instead (see service/app.py:807, which is a
# genuine blocking write inside an async endpoint and is deliberately NOT
# suppressed).
sonar.issue.ignore.multicriteria=e1,e2,e3,e4

# S1244 (float equality): every occurrence is a divide-by-zero guard of the
# form `if <denominator> == 0.0: return nan`, immediately before a division.
# Testing for exactly zero is the intent, and 0.0 is exactly representable, so
# the rule's concern about representation error does not arise.
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S1244
sonar.issue.ignore.multicriteria.e1.resourceKey=deap_pettingzoo/analysis/compare.py

# S7493 (sync file API in async function): the handle is handed to
# create_subprocess_exec as the child's stdout, so it must be a real OS file
# descriptor. An async file API returns a thread-pool wrapper that cannot be
# inherited by a subprocess. The call is a single open(), not bulk I/O.
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S7493
sonar.issue.ignore.multicriteria.e2.resourceKey=deap_pettingzoo/service/install_jobs.py

sonar.issue.ignore.multicriteria.e3.ruleKey=python:S7493
sonar.issue.ignore.multicriteria.e3.resourceKey=deap_pettingzoo/service/dispatcher.py

# S7497 (CancelledError not re-raised): this is the standard "cancel your own
# task, then await it" idiom from the asyncio docs — the CancelledError caught
# is the result of the preceding self._task.cancel(), not an incoming
# cancellation of shutdown(). Re-raising would propagate it out of the FastAPI
# lifespan shutdown phase for no benefit.
sonar.issue.ignore.multicriteria.e4.ruleKey=python:S7497
sonar.issue.ignore.multicriteria.e4.resourceKey=deap_pettingzoo/service/dispatcher.py
