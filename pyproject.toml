[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deap-pettingzoo"
version = "0.1.0"
description = "A bridge library enabling DEAP evolutionary algorithms to work with PettingZoo multi-agent environments"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE.txt"}
authors = [
    {name = "Alex"},
]
keywords = ["evolutionary-algorithms", "multi-agent", "reinforcement-learning", "DEAP", "PettingZoo", "swarm-robotics", "quality-diversity"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "deap>=1.4.1",
    "pettingzoo>=1.24.0",
    "mpe2>=0.1",
    "numpy>=1.21.0",
    "gymnasium>=0.29.0", 
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "isort>=5.12.0",
]
viz = [
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
]
logging = [
    "pyarrow>=14.0",
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4.9",
]
tensorboard = [
    "tensorboard>=2.13",
]
analysis = [
    "deap-pettingzoo[viz]",
    "pandas>=2.0",
    "scipy>=1.11",
    "rliable>=1.2.0",
    "jinja2>=3.1",
]
rl-baselines = [
    # The GroupedIPPO advantage/state flattening monkey-patch in
    # deap_pettingzoo/baselines/agilerl_trainer.py targets AgileRL's
    # internal `concatenate_experiences_into_batches`. It is verified
    # against the 2.6.x series and fails loudly on signature drift.
    "torch>=2.0.0",
    # agilerl is installed separately by install.bat (or manually with
    # --no-deps) because it pins pettingzoo~=1.23.1 which conflicts
    # with mpe2's pettingzoo>=1.24.3.  AgileRL works fine at runtime
    # with newer pettingzoo — the pin is just conservative upstream.
    #   install.bat service          (recommended)
    #   pip install --no-deps "agilerl>=2.6,<3" && pip install -e ".[service]"
]
aquarium = [
    "marl-aquarium @ git+https://github.com/Alex180504/marl-aquarium.git@v0.1.11",
]
supersuit = [
    "supersuit>=3.9",
]
shimmy = [
    "shimmy[openspiel]>=2.0",
]
jax = [
    "jax>=0.4.0,<0.4.37",
    "jaxlib>=0.4.0,<0.4.37",
    "flax>=0.7.0",
]
jaxmarl = [
    "deap-pettingzoo[jax]",
    "jaxmarl>=0.0.4",
]
qdax = [
    "deap-pettingzoo[jax,jaxmarl]",
    "qdax>=0.4.0",
]
neat = [
    "neat-python>=2.0",
]
scoop = [
    "scoop>=0.7,<1.0",
]
dask = [
    "dask[distributed]>=2024.1",
]
ui = [
    "deap-pettingzoo[analysis]",
    "streamlit>=1.30",
    "plotly>=5.0",
    "pillow>=10.0",
    "imageio>=2.31",
    "httpx>=0.24",
    "pyyaml>=6.0",
]
service = [
    "deap-pettingzoo[rl-baselines]",
    "fastapi>=0.100",
    "python-multipart>=0.0.5",
    "uvicorn[standard]>=0.22",
    "pydantic>=2",
    "supersuit>=3.9",
]
ui-full = [
    "deap-pettingzoo[ui,service]",
]
all = [
    "deap-pettingzoo[dev,viz,logging,tensorboard,analysis,rl-baselines,aquarium,supersuit,shimmy,jax,jaxmarl,qdax,neat,scoop,dask,ui,service,ui-full]"
]

[tool.setuptools.packages.find]
include = ["deap_pettingzoo", "deap_pettingzoo.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "smoke: end-to-end smoke tests, run on main/development CI in addition to the unit suite (select with '-m smoke', deselect with '-m \"not smoke\"')",
]
addopts = [
    "--verbose",
    "--cov=deap_pettingzoo",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.black]
line-length = 88
target-version = ["py311", "py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true


