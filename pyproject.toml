[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deap-pettingzoo"
version = "0.1.0"
description = "A bridge library enabling DEAP evolutionary algorithms to work with PettingZoo multi-agent environments"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE.txt"}
authors = [
    {name = "Alex"},
]
keywords = ["evolutionary-algorithms", "multi-agent", "reinforcement-learning", "DEAP", "PettingZoo", "swarm-robotics"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "deap>=1.4.1",
    "pettingzoo>=1.24.0",
    "numpy>=1.21.0",
    "gymnasium>=0.29.0", 
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "isort>=5.12.0",
]
viz = [
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
]
rl-baselines = [
    "stable-baselines3>=2.0.0",
    "torch>=2.0.0",
]
all = [
    "deap-pettingzoo[dev,viz,rl-baselines]",
]

[tool.setuptools]
packages = ["deap_pettingzoo"]

[tool.setuptools.package-data]
deap_pettingzoo = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "--verbose",
    "--cov=deap_pettingzoo",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
