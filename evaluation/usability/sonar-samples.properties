# Scanner configuration for the usability code samples.
#
# A separate project key from the library itself, so the eight comparison
# scripts are measured in isolation and do not perturb the library's own
# quality figures. Run from the repo root via measure_complexity.ps1.

sonar.projectKey=deap-usability-samples
sonar.projectName=DEAP-bridge usability samples
sonar.sourceEncoding=UTF-8

sonar.sources=evaluation/usability/manual,evaluation/usability/bridge
sonar.python.version=3.11

# The measurement harness itself is not part of the comparison.
sonar.exclusions=evaluation/usability/count_concepts.py

# S2245 (insecure RNG) fires on every evolutionary operator that calls
# random.random(). Evolutionary search is exactly what a PRNG is for, and
# the rule would otherwise dominate the sample findings.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.py
