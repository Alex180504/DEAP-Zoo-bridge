name: Docs

# Build the Sphinx documentation and publish it to GitHub Pages.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Least-privilege token plus the two permissions the Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deploy at a time; never cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Headless SDL so the pygame-backed mpe2 envs import without a display.
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy
  # Build with only the [docs] extra installed; mock the one optional backend
  # imported at module level (neat). See docs/conf.py.
  DOCS_MOCK_HEAVY: "1"

jobs:
  build:
    name: Build HTML
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c .github/ci-constraints.txt -e ".[docs]"

      - name: Build HTML docs
        run: python -m sphinx -b html docs docs/_build/html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
