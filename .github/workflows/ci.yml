name: CI

# Runs on every push to any branch.
on:
  push:
    branches:
      - '**'

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Headless SDL so pygame-backed mpe2 envs import/run without a display.
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -c .github/ci-constraints.txt -e ".[dev]"

      - name: black --check
        run: black --check deap_pettingzoo

      - name: isort --check
        run: isort --check deap_pettingzoo

      - name: flake8
        continue-on-error: true
        run: flake8 deap_pettingzoo

      - name: mypy
        continue-on-error: true
        run: mypy deap_pettingzoo

  unit-tests:
    name: Unit tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.11"
    defaults:
      run:
        # windows-latest ships Git Bash; running every step through it keeps
        # one install script for both platforms instead of a PowerShell fork.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1

      - name: Install package (pinned to known-good versions)
        run: |
          python -m pip install --upgrade pip
          C=.github/ci-constraints.txt
          # CPU-only torch (constraints omit torch: the local build is CUDA).
          pip install -c "$C" --index-url https://download.pytorch.org/whl/cpu "torch==2.6.0"
          # AgileRL pins pettingzoo~=1.23.1 (incompatible with mpe2), so install
          # it without deps, then add its real runtime deps EXCEPT pettingzoo.
          # fastrand/pymunk float to wheeled versions (the pinned ones have no
          # manylinux wheel and would otherwise need a source build).
          pip install -c "$C" --no-deps "agilerl==2.6.1"
          pip install -c "$C" packaging accelerate dill flatten-dict google-cloud-storage \
            h5py hydra-core minari omegaconf redis tensordict termcolor tqdm wandb
          pip install fastrand pymunk
          pip install -c "$C" -e ".[dev,viz,logging,tensorboard,analysis,rl-baselines,aquarium,supersuit,shimmy,neat,scoop,dask,ui,service]"
          # JAX/QDax: jaxmarl is dropped (no test imports it) and qdax's
          # brax>=0.10.4 pin is bypassed with --no-deps (it runs on brax 0.10.3);
          # the constraints file keeps the jax/brax stack from being bumped.
          pip install -c "$C" "jax==0.4.38" "jaxlib==0.4.38" "flax==0.10.4" "brax==0.10.3"
          pip install -c "$C" --no-deps "qdax==0.5.0"
          pip install -c "$C" jumanji scikit-learn tensorflow-probability \
            esquilax chex optax jax-tqdm jaxopt

      - name: Run unit tests
        run: python -m pytest --no-cov -q

  docker-compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      # Both images define their own HEALTHCHECK (service hits /health, UI hits
      # /_stcore/health), so waiting for the container health status is more
      # robust than curling from the host before Streamlit has finished booting.
      - name: Wait for service and UI to become healthy
        run: |
          wait_healthy() {
            name="$1"
            for i in $(seq 1 60); do
              status="$(docker inspect --format '{{.State.Health.Status}}' "$name" 2>/dev/null || echo missing)"
              echo "[$name] attempt $i: $status"
              case "$status" in
                healthy) return 0 ;;
                missing) docker compose ps ;;
              esac
              sleep 5
            done
            echo "::error::$name did not become healthy in time"
            return 1
          }
          wait_healthy deap-service
          wait_healthy deap-ui

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

