name: CI

# Runs on every push to any branch.
on:
  push:
    branches:
      - '**'

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Headless SDL so pygame-backed mpe2 envs import/run without a display.
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy
  PYTHONUNBUFFERED: "1"

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1

      # Mirror the canonical install order (Dockerfile.server / install.ps1):
      # CPU-only torch first, then AgileRL without its conservative pettingzoo
      # pin, then the package with every optional extra.
      - name: Install package (all extras, CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.0.0"
          pip install --no-deps "agilerl>=2.6,<3"
          pip install -e ".[all]"

      - name: Run unit tests
        run: python -m pytest --no-cov -q

  docker-compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for service to become healthy
        run: |
          for i in $(seq 1 40); do
            status="$(docker inspect --format '{{.State.Health.Status}}' deap-service 2>/dev/null || echo missing)"
            echo "attempt $i: service health=$status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 5
          done
          echo "::error::service did not become healthy in time"
          exit 1

      - name: Check UI responds
        run: curl -fsS --retry 20 --retry-delay 3 --retry-connrefused http://localhost:8501/_stcore/health

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

