# Minimal Slurm config for the 2-node Docker simulation rig
# (docker/slurm-cluster/docker-compose.yml). Container-specific choices:
#
# - ProctrackType=proctrack/linuxproc + TaskPlugin=task/none: the cgroup
#   plugins need a delegated cgroup v2 hierarchy, which Docker Desktop/WSL2
#   containers don't get; /proc-based tracking works everywhere.
# - SlurmdParameters=config_overrides: the declared node topology never
#   matches what slurmd detects inside a container; trust the config instead
#   of draining the nodes.
# - No log files configured: daemons run with -D, so logs go to stderr and
#   land in `docker logs`.
ClusterName=deap-hpc
SlurmctldHost=slurmctld

AuthType=auth/munge
SlurmUser=slurm
MpiDefault=none
# No mail binary in the container; silence the startup error.
MailProg=/bin/true
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
ReturnToService=2
SlurmdParameters=config_overrides
GresTypes=gpu

StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid

SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_CPU

# No accounting daemon in the rig.
AccountingStorageType=accounting_storage/none
JobAcctGatherType=jobacct_gather/none

SlurmctldTimeout=30
SlurmdTimeout=30

# Node/partition layout the sbatch templates are validated against:
# 2 CPU nodes x 2 CPUs (train_dask.sbatch asks for exactly this), plus an
# opt-in GPU node for AgileRL jobs (compose profile "gpu"; when the profile
# is off, g1 simply shows as down* and the main partition is unaffected).
NodeName=c[1-2] CPUs=2 RealMemory=1000 State=UNKNOWN
NodeName=g1 CPUs=2 RealMemory=4000 Gres=gpu:1 State=UNKNOWN
PartitionName=main Nodes=c[1-2] Default=YES MaxTime=INFINITE State=UP
PartitionName=gpu Nodes=g1 MaxTime=INFINITE State=UP
