# GRES layout for the simulation rig's GPU node (baked into the GPU node
# image only — gres.conf is only needed on nodes that have the resource).
#
# File=/dev/null is deliberate: slurmd only *counts* gpu gres entries that
# name an existing device file, but under Docker Desktop/WSL2 the GPU is
# passed through at the library level (nvidia-smi works, yet there is no
# /dev/nvidia0 or /dev/dxg node to point at). With TaskPlugin=task/none
# there is no device cgroup binding anyway — this entry is scheduling
# metadata that lets --gres=gpu:1 jobs land on g1, while CUDA visibility
# comes from the compose device reservation.
NodeName=g1 Name=gpu File=/dev/null
