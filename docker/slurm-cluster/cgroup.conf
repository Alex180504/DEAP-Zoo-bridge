# Force the cgroup/v1 plugin: slurmd 22.05 autodetects cgroup/v2 and then
# tries to move slurmstepd into a dedicated scope via dbus at startup --
# which fails hard in a plain container (no dbus, no delegated v2
# hierarchy). The v1 plugin initializes lazily, and with
# ProctrackType=proctrack/linuxproc + TaskPlugin=task/none +
# jobacct_gather/none nothing ever consumes it.
CgroupPlugin=cgroup/v1
CgroupAutomount=no
