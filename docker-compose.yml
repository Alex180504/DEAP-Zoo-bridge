# ===========================================================================
# docker-compose.yml — DEAP-bridge containerised deployment
# ===========================================================================
#
# Two supported modes (see comments at the bottom of this file):
#
#   MODE 1 (full stack, default)  →  docker compose up
#       Both the FastAPI service AND the Streamlit UI run as containers.
#       Results are persisted in a named Docker volume.
#
#   MODE 2 (native backend)  →  docker compose --profile native-backend up
#       Only the Streamlit UI is containerised; it connects to a FastAPI
#       service running natively on the host.
#
# Security note:
#   The service container executes dotted Python import paths from
#   experiment specs (trusted-input model).  Bind it to localhost unless
#   you have network-level access controls in place.  Authentication is
#   deferred — put a reverse proxy with auth in front if needed.
# ===========================================================================

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------

services:
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Experiment service (FastAPI + trainers)
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  service:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: deap-bridge-service:latest
    container_name: deap-service
    # The service port is only exposed to the internal compose network by
    # default.  Uncomment the "ports" line to also make it reachable from
    # the host (useful for debugging or native-backend mode with host
    # port forwarding reversed).
    # ports:
    #   - "8100:8100"
    expose:
      - "8100"
    volumes:
      - results:/app/results
    environment:
      - DEAP_RESULTS_ROOT=/app/results
      - SERVICE_HOST=0.0.0.0
      - SERVICE_PORT=8100
    restart: unless-stopped
    # GPU access (uncomment if using a CUDA base image + nvidia-docker):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # Streamlit UI (no ML deps — talks to service over HTTP)
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    image: deap-bridge-ui:latest
    container_name: deap-ui
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    volumes:
      # Read-only access to completed-run data so Browse / Compare /
      # Replay / Report / Inspect can discover results.
      - results:/app/results:ro
    environment:
      - FASTAPI_URL=${FASTAPI_URL:-http://service:8100}
      - DEAP_RESULTS_ROOT=/app/results
      - STREAMLIT_PORT=8501
    depends_on:
      - service
    restart: unless-stopped

  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  # UI-only variant for MODE 2 (native backend).
  # Started with:  docker compose --profile native-backend up
  #
  # This service is identical to `ui` above except it does NOT depend on
  # the `service` container and it expects `FASTAPI_URL` to point at a
  # host-resident FastAPI process.
  # - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
  ui-native:
    build:
      context: .
      dockerfile: Dockerfile.ui
    image: deap-bridge-ui:latest
    container_name: deap-ui-native
    profiles:
      - native-backend
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    volumes:
      # When the backend runs natively, the UI still needs access to the
      # results directory for Browse / Compare / etc.  Mount the host
      # results directory (set RESULTS_HOST_DIR) or a named volume.
      - ${RESULTS_HOST_DIR:-./results}:/app/results:ro
    environment:
      # host.docker.internal resolves to the host gateway on Docker
      # Desktop (Windows/Mac).  On Linux, add:
      #   extra_hosts:
      #     - "host.docker.internal:host-gateway"
      - FASTAPI_URL=${FASTAPI_URL:-http://host.docker.internal:8100}
      - DEAP_RESULTS_ROOT=/app/results
      - STREAMLIT_PORT=8501
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------

volumes:
  results:
    # Named volume so data survives container recreation.  The service
    # writes experiment outputs + _service.db here; the UI reads
    # completed-run manifests for the visualisation pages.
    driver: local

# ===========================================================================
# Usage quick-reference
# ===========================================================================
#
# ── MODE 1: Full containerised stack ───────────────────────────────────
#
#   docker compose build
#   docker compose up
#
#   • Service:  http://127.0.0.1:8100  (internal only by default)
#   • UI:       http://127.0.0.1:8501
#
#   To expose the service port to the host (e.g. for curl debugging),
#   uncomment the `ports` block under the `service` definition above.
#
#
# ── MODE 2: Containerised UI + native backend ──────────────────────────
#
#   Start the FastAPI service on your host first:
#
#     python -m deap_pettingzoo.service --host 127.0.0.1 --port 8100
#
#   Then launch the UI container (it connects to host.docker.internal):
#
#     docker compose --profile native-backend build
#     docker compose --profile native-backend up
#
#   If your results live somewhere other than ./results, set the env var:
#
#     RESULTS_HOST_DIR=/path/to/results docker compose --profile native-backend up
#
#   On Linux, if host.docker.internal doesn't resolve, ensure the
#   `extra_hosts` block under `ui-native` is uncommented (it is by default).
#
#
# ── Useful compose snippets ────────────────────────────────────────────
#
#   Rebuild after code changes:
#     docker compose build --no-cache
#
#   Tail logs:
#     docker compose logs -f
#
#   Shell into a running container:
#     docker compose exec service bash
#     docker compose exec ui bash
#
#   Tear down (including the results volume — DESTRUCTIVE):
#     docker compose down -v
